    /* Rackbook visual system: kept inline so every page remains self-contained. */

<header class="app-header"><div class="page-heading"><button id="pageBack" class="page-back" type="button" aria-label="Go back">← Back</button><div class="page-title"><span class="eyebrow">Rackbook</span><h1>Microcycle Builder</h1></div></div><nav class="app-nav" aria-label="Pages"><a href="/log">Log workout</a><a href="/microcycles" aria-current="page">Microcycles</a><a href="/recent">Recent</a><a href="/progress">Progress</a><a href="/stress">Stress</a><a href="/rpe-charts">RPE tables</a><a href="/legacy#settings">Settings</a></nav></header>
<p class="muted">Plan one week of workouts and train at your own pace. The next workout waits until you finish and save the current one.</p>
<div id="status" role="status"></div>
<div class="row editor-tools"><h2 class="grow">Your plans</h2><button id="newPlan" type="button">+ New microcycle</button></div>
<div id="library" class="library"></div>
<form id="editor" hidden>
 <section class="card editor-title"><label>Microcycle name<input id="planName" required maxlength="120"></label><label>Notes<textarea id="planNotes" rows="2" maxlength="4000"></textarea></label></section>
 <div class="editor-layout"><aside class="card sidebar"><h3>Days</h3><div id="weeks"></div><button id="addDay" type="button">+ Add day</button></aside><section class="card"><div id="sessionEditor"></div></section></div>
 <div class="row savebar"><span id="saveState" class="muted grow"></span><button id="savePlan" class="primary" type="submit">Save plan</button><button id="usePlan" type="button">Use this microcycle</button></div>
</form>
<dialog id="exercisePicker" aria-label="Add movement"><div class="row"><h2 class="grow">Add movement</h2><button id="closeExercisePicker" type="button">Close</button></div><label>Find an exercise<input id="exerciseSearch" type="search" placeholder="Search your Hevy exercises"></label><button id="syncExercises" type="button">Refresh exercise list</button><div id="exerciseResults"></div></dialog>
</main><script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
const $=id=>document.getElementById(id), KEY='mesocycleEditor';
let recovered=[];try{recovered=JSON.parse(localStorage.getItem(KEY+'.weeks'))||[];}catch(e){}
let plans=[], plan=null, wi=0, si=0, dirty=false, catalog=[], busy=false;
let unit='kg';try{if(localStorage.getItem('unit')==='lb')unit='lb';}catch(e){}
const id=()=>crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random();
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
function button(text,fn,cls) {const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b;}
async function api(url,options={}) {const r=await fetch(url,options),data=r.status===204?null:await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Check the plan: '+(data.detail||[]).map(x=>x.msg).join('; '));return data;}
const json=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function message(text) {$('status').textContent=text;$('status').className=text?'message':'';}
function remember() {dirty=true;$('saveState').textContent='Unsaved changes';try{localStorage.setItem(KEY,JSON.stringify({plan,wi,si}));}catch(e){message('This device cannot keep an editor draft. Save the plan before leaving.');}}
function session() {return plan.weeks[wi].sessions[si];}
function completed(s) {return (plan.completed||[]).some(c=>c.session_id===s.id);}
function cloneSession(s) {const copy=structuredClone(s);copy.id=id();return copy;}
function openPlan(p) {if(dirty&&!confirm('Replace your unsaved plan edits?'))return;plan=structuredClone(p);wi=0;si=0;dirty=false;try{localStorage.removeItem(KEY);}catch(e){}renderEditor();message('');}
function nextSession(p) {const done=new Set(p.completed.map(c=>c.session_id));for(const w of p.weeks)for(const s of w.sessions)if(!done.has(s.id))return {w,s};return null;}
function startUrl(p,s) {return '/log?microcycle='+encodeURIComponent(p.id)+'&session='+encodeURIComponent(s.id);}
function duplicateMicrocycle(p){if(dirty&&!confirm('Replace your unsaved plan edits?'))return;plan=structuredClone(p);delete plan.id;plan.name=(plan.name+' copy').slice(0,120);plan.revision=0;plan.completed=[];plan.active=false;plan.weeks[0].sessions=plan.weeks[0].sessions.map(cloneSession);wi=si=0;remember();renderEditor();}
function recoverLegacyEditor(saved){return saved.plan.weeks.filter((w,i)=>i===(saved.wi||0)||w.sessions.some(s=>s.exercises.length)).map(w=>({name:(saved.plan.name+' · '+w.name).slice(0,120),notes:saved.plan.notes||'',revision:0,completed:[],weeks:[{name:'Week 1',sessions:w.sessions.map(cloneSession)}],_recovery:id()}));}
function renderLibrary() {
 const box=$('library');box.replaceChildren();if(!plans.length)box.append(el('p','muted','No plans yet. Create one, add your movements, and save it here.'));
 for(const draft of recovered)box.append(button('Recovered draft: '+draft.name,()=>{openPlan(draft);remember();}));
 for(const p of plans){const card=el('section','card'),next=nextSession(p);card.append(el('h3',null,p.name),el('p','muted',(p.active?'Active · ':'')+p.weeks[0].sessions.length+' workouts · '+p.completed.length+' workouts completed'));
  if(next)card.append(el('p','muted','Next: '+next.s.name));else card.append(el('p','muted',p.weeks[0].sessions.length?'Microcycle complete':'No days yet'));
  const actions=el('div','row');actions.append(button('Edit plan',()=>openPlan(p)),button('Duplicate microcycle',()=>duplicateMicrocycle(p)));
  if(next&&next.s.exercises.length){const a=el('a',null,'Start next workout');a.href=startUrl(p,next.s);actions.append(a);}card.append(actions);box.append(card);}
}
async function refreshPlans(){plans=await api('/api/mesocycles');renderLibrary();}
function newPlan(){if(dirty&&!confirm('Replace your unsaved plan edits?'))return;plan={name:'New microcycle',notes:'',revision:0,completed:[],weeks:[{name:'Week 1',sessions:[]}]};wi=si=0;remember();renderEditor();}
function addDay(){if(plan.weeks[0].sessions.length>=14)return message('A microcycle can have up to 14 days.');let n=1;while(plan.weeks[0].sessions.some(s=>s.name==='Day '+n))n++;plan.weeks[0].sessions.push({id:id(),name:'Day '+n,exercises:[]});si=plan.weeks[0].sessions.length-1;remember();renderEditor();}
function removeDay(){const s=session();if(!s)return;if(completed(s))return message('Completed days retain their history. Duplicate the microcycle to plan a fresh week.');if(s.exercises.length&&!confirm('Remove this day and its planned movements?'))return;plan.weeks[0].sessions.splice(si,1);si=Math.max(0,Math.min(si,plan.weeks[0].sessions.length-1));remember();renderEditor();}
function renderWeeks(){const box=$('weeks');box.replaceChildren();wi=0;si=Math.max(0,Math.min(si,plan.weeks[0].sessions.length-1));$('addDay').disabled=plan.weeks[0].sessions.length>=14;plan.weeks[0].sessions.forEach((s,j)=>{const b=button((completed(s)?'✓ ':'')+s.name,()=>{si=j;renderWeeks();renderSession();},'session-tab');b.setAttribute('aria-label',b.textContent);b.setAttribute('aria-current',String(j===si));box.append(b);});}
function nameField(label,value,change){const wrap=el('label',null,label),input=el('input');input.value=value;input.required=true;input.maxLength=120;input.addEventListener('input',()=>{change(input.value);remember();});input.addEventListener('change',renderWeeks);wrap.append(input);return wrap;}
function numeric(value,label,attrs,change){const input=el('input');input.type='number';input.value=value??'';input.setAttribute('aria-label',label);for(const[k,v]of Object.entries(attrs))input.setAttribute(k,v);input.addEventListener('input',()=>{change(input.value===''?null:Number(input.value));remember();});return input;}
function renderSession(){const box=$('sessionEditor'),s=session();box.replaceChildren();if(!s){box.append(el('p','empty','No days yet. Add a day to start planning.'),button('Add first day',addDay));return;}const done=completed(s);
 const titleRow=el('div','row editor-tools day-name-tools');titleRow.append(nameField('Day name',s.name,v=>s.name=v),button('Duplicate day',()=>{if(plan.weeks[wi].sessions.length>=14)return message('A week can have up to 14 workouts.');const copy=cloneSession(s);copy.name+=' copy';plan.weeks[wi].sessions.push(copy);si=plan.weeks[wi].sessions.length-1;remember();renderEditor();}));box.append(titleRow);
 const tools=el('div','row editor-tools');const remove=button('Remove day',removeDay,'danger');remove.disabled=done;if(done)remove.title='Completed days retain their history';tools.append(remove);box.append(tools);
 if(done)box.append(el('p','muted','Completed workout: duplicate it to make a new session. Its original prescription stays intact.'));
 const fields=el('fieldset');fields.disabled=done;fields.style.cssText='border:0;padding:0;margin:0;min-width:0';
 if(!s.exercises.length)fields.append(el('p','empty','Add a movement to begin planning this workout.'));
 s.exercises.forEach((ex,ei)=>{const card=el('div','movement'),head=el('div','row');head.append(el('h3','grow',ex.title),button('↑',()=>{if(ei){[s.exercises[ei-1],s.exercises[ei]]=[s.exercises[ei],s.exercises[ei-1]];remember();renderSession();}}),button('Remove',()=>{if(confirm('Remove '+ex.title+' from this plan?')){s.exercises.splice(ei,1);remember();renderSession();}},'danger'));card.append(head);
 const scroll=el('div','set-scroll'),labels=el('div','plan-set plan-head');for(const text of ['Set','Reps','RPE','Weight ('+unit+')','TS',''])labels.append(el('span',null,text));scroll.append(labels);
 ex.sets.forEach((set,i)=>{const row=el('div','plan-set');row.append(el('span','muted',String(i+1)),numeric(set.reps,'Reps',{min:1,max:100,step:1,required:''},v=>set.reps=v),numeric(set.rpe,'Target RPE',{min:4,max:10,step:.5,placeholder:'—'},v=>set.rpe=v),numeric(set.weight_kg==null?null:Math.round(set.weight_kg*(unit==='lb'?2.20462262185:1)*100)/100,'Fixed weight in '+unit,{min:0,step:'any',placeholder:'Auto'},v=>set.weight_kg=v==null?null:v/(unit==='lb'?2.20462262185:1)));
 const ts=el('input');ts.type='checkbox';ts.checked=set.ts;ts.setAttribute('aria-label','Mark as TS');ts.addEventListener('change',()=>{ex.sets.forEach(x=>x.ts=false);set.ts=ts.checked;remember();renderSession();});row.append(ts,button('×',()=>{if(ex.sets.length===1)return message('A movement needs at least one set.');ex.sets.splice(i,1);remember();renderSession();}));scroll.append(row);});card.append(scroll,button('+ Set',()=>{if(ex.sets.length>=50)return;ex.sets.push({...ex.sets.at(-1),ts:false});remember();renderSession();}));
 const note=el('label',null,'Movement notes'),text=el('textarea');text.rows=1;text.value=ex.notes;text.maxLength=2000;text.addEventListener('input',()=>{ex.notes=text.value;remember();});note.append(text);card.append(note);fields.append(card);});
 fields.append(button('+ Movement',openPicker));box.append(fields,el('p','muted','Leave weight blank to plan from the movement’s current e1RM/TM and target RPE when you load the workout. Fixed weights override automatic loading. TS takes effect only after a checked set is saved.'));
 if(plan.id&&!dirty&&!done&&s.exercises.length){const a=el('a',null,'Load this workout into the log');a.href=startUrl(plan,s);box.append(a);}
 // Completed prescriptions are immutable; naming fields must also respect this.
 titleRow.querySelector('input').disabled=done;
}
function renderEditor(){$('editor').hidden=false;$('usePlan').disabled=!plan.weeks[0].sessions.length;$('planName').value=plan.name;$('planNotes').value=plan.notes;$('saveState').textContent=dirty?'Unsaved changes':'Plan saved';renderWeeks();renderSession();}
async function save(){if(busy||!$('editor').reportValidity())return false;busy=true;$('savePlan').disabled=true;try{plan.name=$('planName').value.trim();plan.notes=$('planNotes').value;const body={name:plan.name,notes:plan.notes,weeks:plan.weeks,revision:plan.revision};const recovery=plan._recovery;plan=await api(plan.id?'/api/mesocycles/'+encodeURIComponent(plan.id):'/api/mesocycles',json(plan.id?'PUT':'POST',body));dirty=false;localStorage.removeItem(KEY);if(recovery){recovered=recovered.filter(x=>x._recovery!==recovery);localStorage.setItem(KEY+'.weeks',JSON.stringify(recovered));}await refreshPlans();renderEditor();message('Plan saved.');return true;}catch(e){message(e.message);return false;}finally{busy=false;$('savePlan').disabled=false;}}
async function openPicker(){message('');$('exercisePicker').showModal();$('exerciseSearch').value='';try{catalog=await api('/exercises');renderExercises();$('exerciseSearch').focus();}catch(e){message(e.message);}}
function renderExercises(){const terms=$('exerciseSearch').value.toLowerCase().trim().split(/\s+/);const box=$('exerciseResults');box.replaceChildren();const hits=catalog.filter(x=>terms.every(t=>x.title.toLowerCase().includes(t))).slice(0,100);for(const ex of hits)box.append(button(ex.title,()=>{session().exercises.push({exercise_template_id:ex.id,title:ex.title,notes:'',sets:[{reps:5,rpe:7,weight_kg:null,type:'normal',ts:false}]});$('exercisePicker').close();remember();renderSession();}));if(!hits.length)box.append(el('p','muted','No matches. Refresh the exercise list if needed.'));}
$('newPlan').addEventListener('click',newPlan);$('addDay').addEventListener('click',addDay);
$('planName').addEventListener('input',()=>{plan.name=$('planName').value;remember();});$('planNotes').addEventListener('input',()=>{plan.notes=$('planNotes').value;remember();});
$('editor').addEventListener('submit',e=>{e.preventDefault();save();});
$('usePlan').addEventListener('click',async()=>{if((dirty||!plan.id)&&!await save())return;try{plan=await api('/api/mesocycles/'+encodeURIComponent(plan.id)+'/activate',{method:'POST'});await refreshPlans();message('Active microcycle set. Its next workout is ready on the Log page.');}catch(e){message(e.message);}});
$('closeExercisePicker').addEventListener('click',()=>$('exercisePicker').close());$('exerciseSearch').addEventListener('input',renderExercises);
$('syncExercises').addEventListener('click',async()=>{const b=$('syncExercises');b.disabled=true;try{await api('/exercises/sync',{method:'POST'});catalog=await api('/exercises');renderExercises();}catch(e){message(e.message);}finally{b.disabled=false;}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
refreshPlans().then(()=>{try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.plan){
